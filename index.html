<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hebrew Ulpan Flashcards v1.0.3</title>
<style>
:root{--pink:#ea4c91;--pale:#fff0f7;--ink:#222;--muted:#707070;--line:#eadde4}
*{box-sizing:border-box} body{margin:0;background:#faf8f9;color:var(--ink);font-family:Segoe UI,Arial,sans-serif}
.wrap{width:min(94vw,1100px);max-width:none;margin:auto;padding:clamp(12px,2vw,22px)} header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:24px}.sub{font-size:14px;color:var(--muted);margin-top:5px}.controls{display:flex;gap:8px;flex-wrap:wrap}
button,select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer}
button:hover,select:hover{border-color:var(--pink)} .progress{height:9px;background:#eee;border-radius:99px;overflow:hidden;margin:18px 0 9px}
.progress>div{height:100%;background:var(--pink);width:0}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:14px}
.card{height:clamp(430px,72vh,760px);min-height:0;background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 34px #0000000d;display:flex;align-items:center;justify-content:center;text-align:center;padding:clamp(18px,3vh,34px);position:relative}
.tag{position:absolute;top:16px;left:16px;background:var(--pale);color:#9e2f62;padding:6px 10px;border-radius:99px;font-size:12px}
.source{position:absolute;top:17px;right:18px;color:#888;font-size:12px}.prompt{font-size:17px;color:var(--muted);margin-bottom:18px}
.hebrew{font-family:Arial,sans-serif;font-size:150px;line-height:1;direction:rtl}.name{font-size:52px;font-weight:750}.tap{margin-top:28px;color:var(--pink);font-weight:650}
.hidden{display:none!important}.answer{width:100%}.answer h2{font-size:38px;margin:0 0 8px}.print{font-size:82px;line-height:1.1}
.sound{font-size:18px;margin:8px 0 18px}.scriptbox{max-width:440px;background:var(--pale);padding:14px;border-radius:16px;margin:12px auto}
.scriptbox h3{font-size:14px;margin:0 0 10px;color:#8e2f5f}.scriptimg{height:140px;max-width:100%;object-fit:contain;background:#fff;border:1px solid #f2cedf;border-radius:10px;padding:8px}
.final{border-top:1px solid var(--line);margin-top:15px;padding-top:13px}.finalletter{font-size:58px}.write{max-width:470px;margin:15px auto 0;border:1px dashed var(--pink);border-radius:12px;padding:10px 12px;color:#6b3850;font-size:14px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.actions button{font-weight:700;padding:13px 8px}.again{background:#fff1f1}.hard{background:#fff8e9}.good{background:#f0f8f2}.easy{background:#eef4ff}
.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.scriptfront{height:240px;max-width:95%;object-fit:contain;background:white;border-radius:12px;padding:8px}
@media(max-width:600px){.wrap{padding:12px}.card{height:clamp(390px,68vh,620px);padding:18px 14px}.hebrew{font-size:clamp(92px,26vw,125px)}.name{font-size:clamp(34px,10vw,40px)}.actions{grid-template-columns:repeat(2,1fr)}.source{top:auto;bottom:10px}}

/* Responsive back-side scaling */
.answer{
  width:100%;
  font-size:clamp(14px,1.5vw,20px);
  padding:clamp(4px,1vh,12px) 0;
}
.answer h2{
  font-size:clamp(34px,5.5vw,64px)!important;
  line-height:1.05;
  margin:clamp(4px,1vh,10px) 0 clamp(8px,1.5vh,18px);
}
.answer .print{
  font-size:clamp(64px,10vw,120px);
}
.answer .sound{
  font-size:clamp(22px,3.2vw,38px)!important;
  line-height:1.18!important;
  margin:clamp(8px,1.3vh,16px) 0 clamp(10px,1.7vh,20px)!important;
}
.answer .scriptbox{
  max-width:min(72vw,560px);
  padding:clamp(10px,1.5vw,18px);
  margin:clamp(8px,1.3vh,16px) auto;
}
.answer .scriptbox h3{
  font-size:clamp(13px,1.5vw,18px);
}
.answer .scriptimg{
  height:clamp(100px,18vh,190px);
  width:auto;
  max-width:100%;
}
.answer .finalletter{
  font-size:clamp(48px,8vw,92px);
}
.answer .write{
  max-width:min(76vw,600px);
  font-size:clamp(13px,1.35vw,18px);
  padding:clamp(9px,1.3vw,14px);
  margin-top:clamp(8px,1.3vh,16px);
}
@media (max-height:700px){
  .answer h2{font-size:clamp(30px,5vw,50px)!important}
  .answer .scriptimg{height:clamp(80px,15vh,130px)}
  .answer .sound{font-size:clamp(20px,2.8vw,30px)!important}
  .answer .write{font-size:clamp(12px,1.2vw,15px)}
}


/* ---------- Adaptive device UI ---------- */
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

body.phone-ui{
  overscroll-behavior-y: contain;
}
body.phone-ui .wrap{
  width:100%;
  max-width:none;
  min-height:100dvh;
  padding:
    calc(8px + var(--safe-top))
    calc(10px + var(--safe-right))
    calc(10px + var(--safe-bottom))
    calc(10px + var(--safe-left));
  display:flex;
  flex-direction:column;
}
body.phone-ui header{display:block}
body.phone-ui header > div:first-child{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
}
body.phone-ui h1{font-size:clamp(18px,5vw,24px)}
body.phone-ui .sub{display:none}
body.phone-ui .controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}
body.phone-ui .controls select,
body.phone-ui .controls button{
  width:100%;
  min-height:44px;
  padding:8px 9px;
  font-size:clamp(13px,3.5vw,16px);
}
body.phone-ui .controls button#reset{display:none}
body.phone-ui .progress{margin:9px 0 5px;height:7px}
body.phone-ui .stats{
  margin-bottom:7px;
  font-size:clamp(11px,2.9vw,13px);
}
body.phone-ui .card{
  width:100%;
  min-height:0 !important;
  height:auto !important;
  flex:1 1 auto;
  max-height:none !important;
  padding:clamp(16px,4vw,24px);
  border-radius:18px;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}
body.phone-ui .tag{
  top:11px;
  left:11px;
  font-size:10px;
  padding:5px 8px;
}
body.phone-ui .source{
  top:12px;
  right:11px;
  bottom:auto;
  font-size:10px;
}
body.phone-ui .prompt{
  margin-top:26px;
  margin-bottom:12px;
  font-size:clamp(15px,4vw,19px);
}
body.phone-ui .hebrew{
  font-size:clamp(76px,28vw,135px) !important;
}
body.phone-ui .name{
  font-size:clamp(30px,9vw,46px) !important;
}
body.phone-ui .tap{
  margin-top:18px;
  font-size:14px;
}
body.phone-ui .answer h2{
  font-size:clamp(38px,12vw,62px) !important;
  margin-top:24px;
}
body.phone-ui .answer .print{
  font-size:clamp(58px,19vw,92px);
}
body.phone-ui .sound{
  font-size:clamp(22px,6.4vw,32px) !important;
  line-height:1.15 !important;
}
body.phone-ui .scriptbox{
  width:min(100%,420px);
  padding:9px;
  margin:8px auto;
}
body.phone-ui .scriptimg{
  height:clamp(86px,23vh,130px) !important;
}
body.phone-ui .final{
  margin-top:8px;
  padding-top:8px;
}
body.phone-ui .finalletter{
  font-size:clamp(42px,13vw,65px);
}
body.phone-ui .write{
  margin:8px auto 0;
  padding:8px 10px;
  font-size:12px;
}
body.phone-ui .actions{
  order:5;
  position:sticky;
  bottom:calc(4px + var(--safe-bottom));
  z-index:10;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:7px;
  padding:5px;
  background:rgba(250,248,249,.95);
  backdrop-filter:blur(8px);
  border-radius:12px;
}
body.phone-ui .actions button{
  min-height:48px;
  padding:8px 2px;
  font-size:clamp(12px,3.2vw,15px);
}
body.phone-ui .nav{
  order:6;
  display:grid;
  grid-template-columns:1fr 1.25fr 1fr;
  width:100%;
  gap:6px;
  margin-top:7px;
}
body.phone-ui .nav button{
  min-height:46px;
  width:100%;
  padding:8px 4px;
  font-size:13px;
}
body.phone-ui #front,
body.phone-ui #back{width:100%}

body.phone-ui.phone-narrow .controls #shuffle{display:none}
body.phone-ui.phone-narrow .card{border-radius:14px}
body.phone-ui.phone-narrow .actions{grid-template-columns:repeat(2,1fr)}
body.phone-ui.phone-narrow .nav{grid-template-columns:1fr 1fr}
body.phone-ui.phone-narrow #prev{display:none}

body.phone-ui.phone-landscape .wrap{
  padding-top:calc(5px + var(--safe-top));
}
body.phone-ui.phone-landscape header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
body.phone-ui.phone-landscape header > div:first-child{display:block}
body.phone-ui.phone-landscape .controls{
  margin-top:0;
  display:flex;
  flex-wrap:nowrap;
}
body.phone-ui.phone-landscape .controls select,
body.phone-ui.phone-landscape .controls button{
  min-height:36px;
  padding:5px 7px;
  font-size:12px;
}
body.phone-ui.phone-landscape .progress{margin:4px 0 3px}
body.phone-ui.phone-landscape .stats{margin-bottom:3px}
body.phone-ui.phone-landscape .card{
  min-height:52dvh !important;
  padding:10px 20px;
}
body.phone-ui.phone-landscape .prompt{
  margin-top:16px;
  margin-bottom:6px;
}
body.phone-ui.phone-landscape .hebrew{
  font-size:clamp(70px,20vh,115px) !important;
}
body.phone-ui.phone-landscape .answer h2{
  margin-top:12px;
  font-size:clamp(34px,10vh,55px) !important;
}
body.phone-ui.phone-landscape .scriptbox{
  display:inline-block;
  vertical-align:top;
  max-width:42%;
  margin:4px 5px;
}
body.phone-ui.phone-landscape .scriptimg{height:70px !important}
body.phone-ui.phone-landscape .write{display:none}
body.phone-ui.phone-landscape .actions button,
body.phone-ui.phone-landscape .nav button{
  min-height:36px;
  padding:5px;
}

#deviceDebug{
  display:none;
  position:fixed;
  right:8px;
  top:8px;
  z-index:999;
  padding:5px 8px;
  border-radius:8px;
  background:#111;
  color:#fff;
  font:11px/1.2 monospace;
  opacity:.8;
  pointer-events:none;
}
body.debug-device #deviceDebug{display:block}


/* ---------- v1.0.1 adaptive front-text fitting ---------- */
#frontcontent{
  width:100%;
  max-width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
#frontcontent .fit-front-text{
  display:block;
  width:100%;
  max-width:100%;
  max-height:100%;
  overflow:hidden;
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.08;
}
body.phone-ui #frontcontent .fit-front-text{padding-inline:2px;}


/* ---------- v1.0.2 proportional front-text width ---------- */
#frontcontent{
  width:100%;
  max-width:100%;
}
#frontcontent .fit-front-text{
  width:auto;
  max-width:82%;
  margin-inline:auto;
  text-align:center;
}
/* Hebrew can use a little more of the card than English */
#frontcontent .fit-front-text.hebrew{
  max-width:88%;
}
/* On phones, use more of the available width */
body.phone-ui #frontcontent .fit-front-text{
  max-width:94%;
}
body.phone-ui #frontcontent .fit-front-text.hebrew{
  max-width:96%;
}


/* ---------- v1.0.3 single-line front text ---------- */
#frontcontent .fit-front-text{
  white-space:nowrap !important;
  overflow-wrap:normal !important;
  word-break:normal !important;
  hyphens:none !important;
  width:auto !important;
  max-width:none !important;
  overflow:visible !important;
  display:inline-block !important;
  line-height:1 !important;
}

</style>

  const allowedWidth = Math.max(1, cardWidth * widthRatio);

  // Critical v1.0.3 behaviour: absolutely no wrapping.
  el.style.whiteSpace = "nowrap";
  el.style.wordBreak = "normal";
  el.style.overflowWrap = "normal";
  el.style.hyphens = "none";
  el.style.width = "auto";
  el.style.maxWidth = "none";
  el.style.display = "inline-block";
  el.style.lineHeight = "1";

  let size = maxPx;
  el.style.fontSize = size + "px";

  // Width is the only fit constraint for front prompts.
  // Shrink until the full Hebrew/English prompt is one line inside the card.
  while(size > minPx && el.scrollWidth > allowedWidth){
    size -= step;
    el.style.fontSize = size + "px";
  }
}

function fitCurrentFrontText(){
  const front = document.getElementById("front");
  if(!front || front.classList.contains("hidden")) return;

  const content = document.getElementById("frontcontent");
  if(!content) return;

  const target = content.querySelector(".fit-front-text");
  if(!target) return;

  const card = document.getElementById("card");
  const cardWidth = card ? card.clientWidth : window.innerWidth;
  const isHebrew = target.classList.contains("hebrew");
  const isPhone = document.body.classList.contains("phone-ui");

  let maxPx, minPx, widthRatio;

  if(isHebrew){
    widthRatio = isPhone ? 0.96 : 0.88;
    maxPx = isPhone
      ? Math.min(150, cardWidth * 0.34)
      : Math.min(220, cardWidth * 0.24);
    minPx = isPhone ? 28 : 36;
  } else {
    widthRatio = isPhone ? 0.94 : 0.82;
    maxPx = isPhone
      ? Math.min(58, cardWidth * 0.13)
      : Math.min(92, cardWidth * 0.105);
    minPx = isPhone ? 18 : 22;
  }

  fitElementText(target, {
    minPx,
    maxPx,
    step: 1,
    widthRatio
  });
}

function detectAdaptiveUI(){
  const w = window.innerWidth || document.documentElement.clientWidth;
  const h = window.innerHeight || document.documentElement.clientHeight;
  const shortSide = Math.min(w,h);
  const longSide = Math.max(w,h);
  const aspect = w / Math.max(h,1);
  const landscape = w > h;
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const touchPoints = navigator.maxTouchPoints || 0;

  const phoneBySize = shortSide <= 600 && longSide <= 1024;
  const phoneByTouch = coarse && shortSide <= 700;
  const phoneByPortraitShape = !landscape && w <= 640 && aspect <= 0.82;
  const phoneByLandscapeShape = landscape && h <= 500 && w <= 950;
  const isPhone = phoneBySize || phoneByTouch || phoneByPortraitShape || phoneByLandscapeShape;
  const isNarrow = isPhone && w <= 390 && !landscape;

  document.body.classList.toggle("phone-ui", isPhone);
  document.body.classList.toggle("phone-narrow", isNarrow);
  document.body.classList.toggle("phone-landscape", isPhone && landscape);
  requestAnimationFrame(fitCurrentFrontText);

  const debug = document.getElementById("deviceDebug");
  if(debug){
    debug.textContent =
      `${isPhone ? "PHONE" : "DESKTOP"} | ${w}×${h} | AR ${aspect.toFixed(2)} | ${landscape ? "landscape" : "portrait"} | coarse:${coarse} | touch:${touchPoints}`;
  }
}

(function initAdaptiveUI(){
  if(new URLSearchParams(location.search).get("debugui")==="1"){
    document.body.classList.add("debug-device");
  }
  detectAdaptiveUI();

  let resizeTimer;
  const update = ()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      detectAdaptiveUI();
      if(typeof render==="function") render();
    },80);
  };

  window.addEventListener("resize", update);
  window.addEventListener("orientationchange", ()=>setTimeout(update,180));
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", update);
  }
})();

</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(err => console.log("Service worker registration failed:", err));
  });
}
</script>
